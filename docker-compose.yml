# PrepTracker — home-lab deployment.
#
# Bound to 127.0.0.1 by default: nothing is reachable from the network until you
# deliberately change APP_BIND (see docs/DEPLOYMENT.md for LAN, Tailscale and
# reverse-proxy options).

name: preptracker

services:
  db:
    image: postgres:16-alpine
    container_name: preptracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-preptracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-preptracker}
      # Deterministic collation so index behaviour never depends on the host.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - preptracker_db:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-preptracker} -d ${POSTGRES_DB:-preptracker}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # The database is only ever reached by the app over the compose network.
    expose:
      - '5432'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: preptracker:latest
    container_name: preptracker-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-preptracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-preptracker}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: ${TZ:-UTC}
      PORT: '3000'
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000'
    volumes:
      - ./backups:/app/backups

volumes:
  preptracker_db:
    name: preptracker_db
