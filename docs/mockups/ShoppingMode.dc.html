<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shopping Mode</title>
  <script src="./support.js"></script>
</head>

<x-dc>
<helmet>
  <style>
  body { margin: 0; background: #fafcff; color: #0c121a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 22px; }
  a { color: #2966cc; } a:hover { color: #1f4f9f; }
  * { box-sizing: border-box; }
  .num { font-variant-numeric: tabular-nums; }
  .screen { width: 390px; background: #fafcff; position: relative; display: flex; flex-direction: column; overflow: hidden; }
  .body { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 24px; }
  .hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 16px 12px; }
  .h1 { font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .sub { font-size: 13px; line-height: 18px; color: #626975; margin: 0; }
  .eyebrow { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #626975; }
  .section { font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #626975; display: flex; align-items: center; justify-content: space-between; padding: 12px 0 0; }
  .card { background: #ffffff; border: 1px solid #dee1e7; border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; border-top: 1px solid #dee1e7; }
  .row:first-child { border-top: 0; }
  .grow { flex: 1; min-width: 0; }
  .title { font-size: 17px; line-height: 22px; font-weight: 600; }
  .secondary { font-size: 13px; line-height: 18px; color: #626975; }
  .metric { font-size: 28px; line-height: 32px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: 10px; font-size: 16px; font-weight: 600; border: 1px solid transparent; }
  .btn.hero { height: 52px; width: 100%; background: #1c8742; color: #fff; }
  .btn.primary { background: #2966cc; color: #fff; }
  .btn.tonal { background: #e6f3ff; color: #2966cc; height: 52px; }
  .btn.outline { background: #ffffff; border-color: #dee1e7; color: #0c121a; height: 44px; }
  .btn.text { background: transparent; color: #2966cc; height: 44px; padding: 0 8px; }
  .btn.danger { background: #cc2827; color: #fff; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #dee1e7; background: #ffffff; font-size: 15px; font-weight: 500; }
  .chip.on { background: #e6f3ff; border-color: #2966cc; color: #2966cc; }
  .pill { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 16px; }
  .pill.success { background: #e0fae4; color: #067132; }
  .pill.training { background: #e6f3ff; color: #2966cc; }
  .pill.rest { background: #d8faf9; color: #007475; }
  .pill.warn { background: #ffefcd; color: #9a5b00; }
  .pill.neutral { background: #eff2f7; color: #626975; }
  .seg { display: flex; background: #eff2f7; border-radius: 999px; padding: 4px; height: 48px; gap: 4px; }
  .seg > div { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; font-size: 15px; font-weight: 600; color: #626975; }
  .seg > div.on { background: #2966cc; color: #fff; }
  .seg > div.on.rest { background: #008080; }
  .seg.small { height: 36px; padding: 3px; }
  .seg.small > div { font-size: 13px; }
  .seg.small > div.on { background: #ffffff; color: #0c121a; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .bar { height: 6px; border-radius: 999px; background: #eff2f7; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: #2966cc; border-radius: 999px; }
  .bar.thin { height: 4px; }
  .nav { display: flex; align-items: stretch; height: 64px; border-top: 1px solid #dee1e7; background: #ffffff; }
  .nav > div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #626975; }
  .nav > div.on { color: #2966cc; }
  .nav > div.on span.ind { position: absolute; width: 20px; height: 3px; border-radius: 999px; background: #2966cc; top: 0; }
  .nav > div { position: relative; }
  .pinned { position: absolute; left: 0; right: 0; bottom: 0; }
  .input { display: flex; align-items: center; justify-content: space-between; height: 48px; border: 1px solid #8e929a; border-radius: 10px; padding: 0 14px; background: #ffffff; font-size: 16px; }
  .label { font-size: 13px; line-height: 16px; font-weight: 500; }
  .hint { font-size: 13px; line-height: 18px; color: #626975; }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.55); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-radius: 20px 20px 0 0; border: 1px solid #dee1e7; display: flex; flex-direction: column; }
  .sheet-hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px; border-bottom: 1px solid #dee1e7; }
  .sheet-bd { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
  .sheet-ft { display: flex; gap: 8px; padding: 12px 16px 20px; border-top: 1px solid #dee1e7; }
  .sheet-ft .btn { flex: 1; }
  .ing { display: flex; align-items: baseline; gap: 12px; padding: 6px 0; }
  .ing .amt { width: 64px; flex: none; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .step { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-top: 1px solid #dee1e7; }
  .step .n { width: 24px; height: 24px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex: none; }
  .tile { flex: 1; background: #ffffff; border: 1px solid #dee1e7; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
  .cb { width: 28px; height: 28px; border-radius: 8px; border: 2px solid #8e929a; flex: none; display: flex; align-items: center; justify-content: center; }
  .cb.on { background: #1c8742; border-color: #1c8742; color: #fff; }
  .cb.big { width: 44px; height: 44px; border-radius: 999px; }
  .banner { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #ffefcd; color: #9a5b00; font-size: 13px; font-weight: 500; }
</style>
</helmet>
